services:
  - type: web
    name: jtcard-platform
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: JTCard2025!
    autoDeploy: false
    
databases:
  - name: jtcard-db
    plan: free
    databaseName: jtcard_platform
    user: jtcard_user
